services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://elizon.ru}
      - CASES_DATA_PATH=/app/data/cases.json
      - LEADS_DATA_PATH=/app/data/leads.json
    volumes:
      # Persist cases + orders/clients (PII) across rebuilds
      - ./data:/app/data
